<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Group & Spatial Containment Buddy</title>
  <link rel="stylesheet" href="./vendor/apk-contracts/apk-tokens.css">
  <link rel="stylesheet" href="css/theme.css">
  <link rel="stylesheet" href="./vendor/apk-table/apk-table.css">
  <style>
    .main-layout {
      display: flex;
      flex-direction: column;
      height: calc(100vh - 70px);
      padding: 16px;
      gap: 16px;
      box-sizing: border-box;
    }
    .panel {
      background: var(--surface-primary, #18181b);
      border: 1px solid var(--border-color, #2c2c2c);
      border-radius: 8px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .panel-header {
      padding: 12px 16px;
      background: var(--surface-secondary, #0f0f11);
      border-bottom: 1px solid var(--border-color, #2c2c2c);
      font-weight: 600;
      font-size: 13px;
      color: var(--text-bright, #f4f4f5);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .svg-viewport {
      background: var(--surface-bg, #121212);
      padding: 10px;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    .table-container {
      flex: 1;
      overflow-y: auto;
    }
  </style>
</head>
<body class="deep-horizon">
  <div class="window-header">
    <div class="window-title">
      <span class="window-icon">🏢</span>
      <span class="window-text">Group & Spatial Containment Buddy</span>
      <span id="block-tag" class="block-tag">CONTAINMENT BLOCK</span>
    </div>
    <div class="window-actions">
      <input type="text" id="prop-name" placeholder="Containment Name" style="background: var(--surface-bg); border: 1px solid var(--border-color); border-radius: 4px; padding: 4px 8px; color: var(--text-bright); font-size: 12px; width: 200px;">
      <button id="btn-open" class="btn-action">📂 Open Block</button>
      <button id="btn-save" class="btn-action btn-primary">💾 Save & Return</button>
      <button id="btn-close" class="btn-action btn-close">✕</button>
    </div>
  </div>

  <div class="main-layout">
    <!-- Visual Containment Hierarchy Viewport -->
    <div class="panel" style="flex: 0 0 auto;">
      <div class="panel-header">
        <span>Spatial Hierarchy & Containment Boundary Map</span>
        <button id="btn-add-group" class="btn-action btn-small">+ Add Spatial Boundary</button>
      </div>
      <div id="containment-svg" class="svg-viewport"></div>
    </div>

    <!-- Groups Schedule Table -->
    <div class="panel" style="flex: 1 1 auto;">
      <div class="panel-header">
        <span>Spatial Boundaries & Nesting Relations</span>
      </div>
      <div class="table-container">
        <div id="group-table"></div>
      </div>
    </div>
  </div>

  <script src="./vendor/apk-contracts/apk-contracts.global.js"></script>
  <script src="/FrontEnd/shared/apk-bus.js"></script>
  <script src="./vendor/apk-softapp/apk-softapp.js"></script>
  <script src="./vendor/apk-table/apk-table.js"></script>
  <script type="module" src="js/groupApp.js"></script>
</body>
</html>
